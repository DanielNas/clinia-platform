version: "3.9"

services:
  api:
    container_name: clinia_api
    build: ./backend
    command: npm run start
    volumes:
      - ./backend:/app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    container_name: clinia_db
    environment:
      POSTGRES_DB: clinia
      POSTGRES_USER: clinia
      POSTGRES_PASSWORD: clinia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: clinia_redis
    ports:
      - "6379:6379"

  adminer:
    image: adminer
    container_name: clinia_adminer
    ports:
      - "8080:8080"

volumes:
  postgres_data:
